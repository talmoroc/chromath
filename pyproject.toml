[project]
name = "chromath"
version = "0.0.1"
description = "Music objects analyzer (chords, intervals, scales, tonalities) built on numpy."
readme = "README.md"
authors = [
    { name = "monotom", email = "tom.coral@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=2.2.0",
    "pytest-cov>=7.1.0",
    "scipy>=1.17.0",
]

[project.optional-dependencies]
playback = [
    "fastapi>=0.128.0",
    "mido>=1.3.3",
    "pydantic>=2.12.5",
    "scipy>=1.17.0",
    "uvicorn>=0.40.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "beartype>=0.22.9",
    "hypothesis>=6.168.0",
    "ipykernel>=7.1.0",
    "ipython>=9.9.0",
    "jupyter>=1.1.1",
    "pyright>=1.1.414",
    "pytest>=9.0.2",
    "pytest-watcher>=0.6.3",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "NPY", "RUF"]

[tool.pyright]
# Only the modules already refactored to the typed core; add the others as they are.
include = [
    "src/chromath/types.py",
    "src/chromath/core/chroma.py",
    "src/chromath/core/cycle.py",
    "src/chromath/objects",
]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--tb=short", "-q"]
xfail_strict = true

[tool.pytest-watcher]
now = true
clear = true
delay = 0.2
runner = "uv"
runner_args = ["run", "pytest"]
patterns = ["*.py"]
