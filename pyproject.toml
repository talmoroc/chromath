[project]
name = "chordvoyager"
version = "0.0.1"
description = "Chord Analysis and Generation Library"
readme = "README.md"
authors = [
    { name = "monotom", email = "tom.coral@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.1",
]

[project.optional-dependencies]
playback = [
    "fastapi>=0.128.0",
    "mido>=1.3.3",
    "pydantic>=2.12.5",
    "scipy>=1.17.0",
    "uvicorn>=0.40.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.9.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]
