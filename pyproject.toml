[project]
name = "chordvoyager"
version = "0.1.0"
description = "Chord Analysis and Generation Library"
readme = "README.md"
authors = [
    { name = "monotom", email = "tom.coral@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.1",
]

[project.optional-dependencies]
playback = [
    "mido>=1.3.3",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]
